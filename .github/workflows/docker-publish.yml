name: Build and Publish Production Docker Image

on:
  push:
    branches:
      - feat/llm-hub
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional custom image tag'
        required: false
        default: 'manual-latest'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Meta (Extract metadata)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: wans10/maxvideoai-cn
          tags: |
            # Tag strategy
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE=${{ secrets.NEXT_PUBLIC_API_BASE || vars.NEXT_PUBLIC_API_BASE || '/api' }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL || vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_ASSET_MAX_IMAGE_DIMENSION=${{ secrets.NEXT_PUBLIC_ASSET_MAX_IMAGE_DIMENSION || vars.NEXT_PUBLIC_ASSET_MAX_IMAGE_DIMENSION || '6144' }}
            NEXT_PUBLIC_ASSET_MAX_IMAGE_MB=${{ secrets.NEXT_PUBLIC_ASSET_MAX_IMAGE_MB || vars.NEXT_PUBLIC_ASSET_MAX_IMAGE_MB || '25' }}
            NEXT_PUBLIC_ASSET_UPLOAD_TARGET_MB=${{ secrets.NEXT_PUBLIC_ASSET_UPLOAD_TARGET_MB || vars.NEXT_PUBLIC_ASSET_UPLOAD_TARGET_MB || '4' }}
            NEXT_PUBLIC_BING_VERIFY=${{ secrets.NEXT_PUBLIC_BING_VERIFY || vars.NEXT_PUBLIC_BING_VERIFY }}
            NEXT_PUBLIC_CLARITY_ALLOWED_HOSTS=${{ secrets.NEXT_PUBLIC_CLARITY_ALLOWED_HOSTS || vars.NEXT_PUBLIC_CLARITY_ALLOWED_HOSTS }}
            NEXT_PUBLIC_CLARITY_DEBUG=${{ secrets.NEXT_PUBLIC_CLARITY_DEBUG || vars.NEXT_PUBLIC_CLARITY_DEBUG || 'false' }}
            NEXT_PUBLIC_CLARITY_ID=${{ secrets.NEXT_PUBLIC_CLARITY_ID || vars.NEXT_PUBLIC_CLARITY_ID }}
            NEXT_PUBLIC_COOKIE_DOMAIN=${{ secrets.NEXT_PUBLIC_COOKIE_DOMAIN || vars.NEXT_PUBLIC_COOKIE_DOMAIN }}
            NEXT_PUBLIC_DEFAULT_RESULT_PROVIDER=${{ secrets.NEXT_PUBLIC_DEFAULT_RESULT_PROVIDER || vars.NEXT_PUBLIC_DEFAULT_RESULT_PROVIDER }}
            NEXT_PUBLIC_DISABLE_GA=${{ secrets.NEXT_PUBLIC_DISABLE_GA || vars.NEXT_PUBLIC_DISABLE_GA || 'false' }}
            NEXT_PUBLIC_DISABLE_GTM=${{ secrets.NEXT_PUBLIC_DISABLE_GTM || vars.NEXT_PUBLIC_DISABLE_GTM || 'false' }}
            NEXT_PUBLIC_ENABLE_CLARITY=${{ secrets.NEXT_PUBLIC_ENABLE_CLARITY || vars.NEXT_PUBLIC_ENABLE_CLARITY || 'false' }}
            NEXT_PUBLIC_ENABLE_SEARCH_SCHEMA=${{ secrets.NEXT_PUBLIC_ENABLE_SEARCH_SCHEMA || vars.NEXT_PUBLIC_ENABLE_SEARCH_SCHEMA || 'false' }}
            NEXT_PUBLIC_ENABLE_THUMBNAILS=${{ secrets.NEXT_PUBLIC_ENABLE_THUMBNAILS || vars.NEXT_PUBLIC_ENABLE_THUMBNAILS || 'true' }}
            NEXT_PUBLIC_FAL_FILES_BASE_URL=${{ secrets.NEXT_PUBLIC_FAL_FILES_BASE_URL || vars.NEXT_PUBLIC_FAL_FILES_BASE_URL }}
            NEXT_PUBLIC_FEATURE_LAUNCH_TIMESTAMP=${{ secrets.NEXT_PUBLIC_FEATURE_LAUNCH_TIMESTAMP || vars.NEXT_PUBLIC_FEATURE_LAUNCH_TIMESTAMP }}
            NEXT_PUBLIC_GA4_ID=${{ secrets.NEXT_PUBLIC_GA4_ID || vars.NEXT_PUBLIC_GA4_ID }}
            NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID || vars.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_CURRENCY=${{ secrets.NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_CURRENCY || vars.NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_CURRENCY }}
            NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_ID || vars.NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_ID }}
            NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_VALUE=${{ secrets.NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_VALUE || vars.NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_VALUE }}
            NEXT_PUBLIC_GOOGLE_ADS_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_ADS_ID || vars.NEXT_PUBLIC_GOOGLE_ADS_ID }}
            NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID || vars.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
            NEXT_PUBLIC_GOOGLE_CONSENT_MODE=${{ secrets.NEXT_PUBLIC_GOOGLE_CONSENT_MODE || vars.NEXT_PUBLIC_GOOGLE_CONSENT_MODE || 'auto' }}
            NEXT_PUBLIC_GTM_ID=${{ secrets.NEXT_PUBLIC_GTM_ID || vars.NEXT_PUBLIC_GTM_ID }}
            NEXT_PUBLIC_LEGAL_MIN_AGE=${{ secrets.NEXT_PUBLIC_LEGAL_MIN_AGE || vars.NEXT_PUBLIC_LEGAL_MIN_AGE || '15' }}
            NEXT_PUBLIC_RESULT_PROVIDER=${{ secrets.NEXT_PUBLIC_RESULT_PROVIDER || vars.NEXT_PUBLIC_RESULT_PROVIDER || 'fal' }}
            NEXT_PUBLIC_SERVICE_NOTICE=${{ secrets.NEXT_PUBLIC_SERVICE_NOTICE || vars.NEXT_PUBLIC_SERVICE_NOTICE }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY || vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_VISITOR_WORKSPACE_ACCESS=${{ secrets.NEXT_PUBLIC_VISITOR_WORKSPACE_ACCESS || vars.NEXT_PUBLIC_VISITOR_WORKSPACE_ACCESS }}
            NEXT_PUBLIC_WORKSPACE_CENTER_GALLERY=${{ secrets.NEXT_PUBLIC_WORKSPACE_CENTER_GALLERY || vars.NEXT_PUBLIC_WORKSPACE_CENTER_GALLERY || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
